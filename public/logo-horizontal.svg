<?xml version="1.0" encoding="utf-8"?>
<!-- Trackela - Logo horizontal con texto para navbar -->
<svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" x="0px" y="0px"
	 viewBox="0 0 180 32" style="enable-background:new 0 0 180 32;" xml:space="preserve">
<defs>
  <linearGradient id="trackelaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" style="stop-color:#7c3aed;stop-opacity:1" />
    <stop offset="50%" style="stop-color:#4f46e5;stop-opacity:1" />
    <stop offset="100%" style="stop-color:#0ea5e9;stop-opacity:1" />
  </linearGradient>
</defs>

<!-- Icon -->
<rect x="0" y="0" width="32" height="32" rx="8" fill="url(#trackelaGrad)"/>
<rect x="7" y="7" width="18" height="3.5" rx="1.75" fill="#ffffff"/>
<rect x="14.25" y="7" width="3.5" height="18" rx="1.75" fill="#ffffff"/>
<circle cx="10" cy="23" r="1.8" fill="#ffffff" opacity="0.9"/>
<circle cx="22" cy="23" r="1.8" fill="#ffffff" opacity="0.9"/>
<line x1="12.5" y1="22" x2="14" y2="18" stroke="#ffffff" stroke-width="1" opacity="0.5"/>
<line x1="19.5" y1="22" x2="18" y2="18" stroke="#ffffff" stroke-width="1" opacity="0.5"/>

<!-- Text "Trackela" -->
<text x="42" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800" fill="#ffffff" letter-spacing="-0.5">
  Trackela
</text>
</svg>
