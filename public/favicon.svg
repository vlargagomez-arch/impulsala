<?xml version="1.0" encoding="UTF-8"?>
<!-- Favicon Impulsala - profesional, moderno, agencia tech -->
<svg width="120" height="120" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradiente principal índigo -> fucsia -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="55%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#db2777"/>
    </linearGradient>
    <!-- Gradiente sutil para el brillo de la i -->
    <linearGradient id="letterGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <!-- Glow del punto -->
    <radialGradient id="dotGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Fondo redondeado con gradiente vibrante -->
  <rect x="0" y="0" width="120" height="120" rx="28" fill="url(#bgGrad)"/>

  <!-- Brillo sutil en la esquina superior izquierda -->
  <ellipse cx="35" cy="30" rx="40" ry="30" fill="#ffffff" opacity="0.08"/>

  <!-- Glow detrás del punto -->
  <circle cx="60" cy="28" r="22" fill="url(#dotGlow)"/>

  <!-- Punto de la i - circular, perfectamente centrado -->
  <circle cx="60" cy="28" r="10" fill="url(#letterGrad)"/>

  <!-- Barra vertical de la i - elegante, con leve taper -->
  <path d="M 50 48
           Q 50 44 54 44
           L 66 44
           Q 70 44 70 48
           L 70 92
           Q 70 96 66 96
           L 54 96
           Q 50 96 50 92
           Z"
        fill="url(#letterGrad)"/>

  <!-- Brillo sutil en el borde izquierdo de la barra -->
  <path d="M 52 50
           L 52 90
           L 54 90
           L 54 50
           Z"
        fill="#ffffff" opacity="0.3"/>
</svg>
